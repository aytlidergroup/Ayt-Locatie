<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Magazine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, Roboto, Tahoma, sans-serif;
    background: #f1f5f9; color: #0f172a;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    background: linear-gradient(135deg,#1e3a8a,#2563eb);
    color: white; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    padding-top: max(12px, env(safe-area-inset-top));
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; flex: 1; }
  .add-btn {
    background: rgba(255,255,255,.2); border: none; color: white;
    width: 40px; height: 40px; border-radius: 10px;
    font-size: 22px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .add-btn:active { background: rgba(255,255,255,.4); }

  .search-box {
    background: white; padding: 10px 14px;
    display: flex; gap: 8px; flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
  }
  .search-box input {
    flex: 1; padding: 11px 14px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 15px; font-family: inherit;
    background: #f8fafc;
  }
  .search-box input:focus { outline: none; border-color: #2563eb; background: white; }
  .search-box select {
    padding: 11px 8px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 13px; font-family: inherit;
    background: #f8fafc; max-width: 110px;
  }

  #map {
    height: 220px; width: 100%; flex-shrink: 0;
    border-bottom: 2px solid #e2e8f0;
  }

  #countBar {
    padding: 8px 14px; background: #f8fafc; font-size: 12px;
    color: #475569; border-bottom: 1px solid #e2e8f0;
    flex-shrink: 0;
  }

  #list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: white;
  }
  .card {
    padding: 14px; border-bottom: 1px solid #e2e8f0;
    cursor: pointer;
  }
  .card:active { background: #f1f5f9; }
  .card.active { background: #dbeafe; border-left: 4px solid #2563eb; }

  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }

  .card-line {
    font-size: 13px; color: #475569; margin-top: 4px;
    display: flex; gap: 6px;
  }
  .card-line .icon { flex-shrink: 0; }

  .region-chip {
    display: inline-block; font-size: 11px; padding: 3px 9px;
    background: #ede9fe; color: #6d28d9; border-radius: 10px;
    margin-top: 6px; font-weight: 600;
  }
  .status {
    display: inline-block; font-size: 11px; padding: 3px 9px;
    border-radius: 10px; margin-top: 6px; font-weight: 600;
  }
  .status.has { background: #dcfce7; color: #166534; }
  .status.no { background: #fee2e2; color: #991b1b; }

  .card-actions {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .card-actions button {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit;
  }
  .btn-map { background: #dbeafe; color: #1e40af; }
  .btn-nav { background: #16a34a; color: white; }
  .btn-edit { background: #f1f5f9; color: #475569; }
  .card-actions button:active { opacity: .7; }
  .card-actions button:disabled { opacity: .4; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,.6);
    display: none; z-index: 1000;
    align-items: flex-end;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white; width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 18px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    max-height: 92dvh; overflow-y: auto;
    animation: slideUp .25s;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px; background: #cbd5e1;
    border-radius: 2px; margin: 0 auto 16px;
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; text-align: center; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 12px; color: #475569;
    margin-bottom: 5px; font-weight: 600;
  }
  .field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-family: inherit; font-size: 15px; background: #f8fafc;
  }
  .field input:focus { outline: none; border-color: #2563eb; background: white; }
  .coords { display: flex; gap: 8px; }
  .coords .field { flex: 1; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    flex: 1; padding: 13px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer;
    font-family: inherit;
  }
  .btn-cancel { background: #e2e8f0; color: #475569; }
  .btn-save { background: #16a34a; color: white; }
  .btn-gps {
    background: #d97706; color: white; padding: 12px;
    font-size: 13px; font-weight: 700; border: none;
    border-radius: 10px; cursor: pointer; width: 100%;
    margin-bottom: 8px; font-family: inherit;
  }
  .btn-geocode {
    background: #2563eb; color: white; padding: 12px;
    font-size: 13px; font-weight: 700; border: none;
    border-radius: 10px; cursor: pointer; width: 100%;
    margin-bottom: 14px; font-family: inherit;
  }
  .btn-geocode:disabled { opacity: .6; }

  .nav-option {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px; background: #f8fafc;
    border: 1.5px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 10px; text-decoration: none;
    color: #0f172a; font-size: 15px;
  }
  .nav-option:active { background: #dbeafe; border-color: #2563eb; }
  .nav-option .nicon {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .nav-option .ntext { flex: 1; font-weight: 600; }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: white; padding: 12px 22px;
    border-radius: 12px; font-size: 14px; opacity: 0;
    transition: opacity .3s; pointer-events: none;
    z-index: 2000; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  #loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.85);
    display: none; align-items: center; justify-content: center;
    z-index: 3000; flex-direction: column; gap: 14px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #e2e8f0;
    border-top-color: #2563eb; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🏪 Magazine</h1>
  <button class="add-btn" onclick="openAdd()">+</button>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Caută nume, adresă, regiune...">
  <select id="filter">
    <option value="all">Toate</option>
    <option value="has">Cu locație</option>
    <option value="no">Fără locație</option>
  </select>
</div>

<div id="map"></div>
<div id="countBar"><span id="count">Se încarcă...</span></div>
<div id="list"></div>

<!-- MODAL ADAUGĂ -->
<div class="modal-bg" id="addModal" onclick="if(event.target===this)closeM('addModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>➕ Magazin nou</h2>
    <div class="field"><label>Nume magazin *</label><input id="a_name"></div>
    <div class="field"><label>Adresă</label><input id="a_addr" placeholder="Strada, număr, oraș..."></div>
    <div class="field"><label>Regiune / Oraș</label><input id="a_region"></div>
    <button class="btn-geocode" id="a_geocodeBtn" onclick="geocode('a')">🌍 Găsește locația din adresă</button>
    <div class="field"><label>Link Google Maps</label><input id="a_map" placeholder="https://maps.google.com/..."></div>
    <div class="coords">
      <div class="field"><label>Long</label><input id="a_lng" inputmode="decimal"></div>
      <div class="field"><label>Lat</label><input id="a_lat" inputmode="decimal"></div>
    </div>
    <button class="btn-gps" onclick="gps('a')">📍 Folosește locația mea</button>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeM('addModal')">Anulează</button>
      <button class="btn-save" onclick="saveAdd()">💾 Salvează</button>
    </div>
  </div>
</div>

<!-- MODAL EDITEAZĂ -->
<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeM('editModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>✏️ Editează</h2>
    <input type="hidden" id="e_row">
    <div class="field"><label>Nume magazin *</label><input id="e_name"></div>
    <div class="field"><label>Adresă</label><input id="e_addr"></div>
    <div class="field"><label>Regiune / Oraș</label><input id="e_region"></div>
    <button class="btn-geocode" id="e_geocodeBtn" onclick="geocode('e')">🌍 Găsește locația din adresă</button>
    <div class="field"><label>Link Google Maps</label><input id="e_map"></div>
    <div class="coords">
      <div class="field"><label>Long</label><input id="e_lng" inputmode="decimal"></div>
      <div class="field"><label>Lat</label><input id="e_lat" inputmode="decimal"></div>
    </div>
    <button class="btn-gps" onclick="gps('e')">📍 Folosește locația mea</button>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeM('editModal')">Anulează</button>
      <button class="btn-save" onclick="saveEdit()">💾 Salvează</button>
    </div>
  </div>
</div>

<!-- MODAL NAVIGARE -->
<div class="modal-bg" id="navModal" onclick="if(event.target===this)closeM('navModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>🧭 Deschide în</h2>
    <a class="nav-option" id="navGoogle" target="_blank" rel="noopener">
      <div class="nicon" style="background:#dbeafe;">🗺️</div>
      <div class="ntext">Google Maps</div>
    </a>
    <a class="nav-option" id="navWaze" target="_blank" rel="noopener">
      <div class="nicon" style="background:#dcfce7;">🚗</div>
      <div class="ntext">Waze</div>
    </a>
    <a class="nav-option" id="navApple" target="_blank" rel="noopener" style="display:none;">
      <div class="nicon" style="background:#f1f5f9;">🍎</div>
      <div class="ntext">Apple Maps</div>
    </a>
    <button class="btn-gps" onclick="copyCoords()" style="background:#fef3c7;color:#92400e;margin-top:10px;">
      📋 Copiază coordonatele
    </button>
    <button class="btn-cancel" style="width:100%;padding:13px;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;" onclick="closeM('navModal')">Închide</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>

<script>
/* ⚠️ PUNEȚI AICI LINKUL APPS SCRIPT */
const API_URL = "https://script.google.com/macros/s/AKfycbyPOsBcnW2d8kHf1-vzT5ynRenybxocEc08wTw1MIvBJt2K9jWPXhKa0foPzUYLLe1oKQ/exec";

let stores = [];
let map, markersLayer;
let navTarget = null;

/* ============================================================
   🔧 PARSARE CORECTĂ A COORDONATELOR (rezolvă problema țării greșite)
   ============================================================ */
function parseCoord(val, type) {
  if (val === null || val === undefined) return null;
  // Convertim la string și înlocuim virgula zecimală cu punct
  let s = String(val).trim().replace(',', '.');
  // Eliminăm spații
  s = s.replace(/\s+/g, '');
  const num = parseFloat(s);
  if (isNaN(num)) return null;

  // Verificare interval valid
  if (type === 'lat' && (num < -90 || num > 90)) return null;
  if (type === 'lng' && (num < -180 || num > 180)) return null;
  return num;
}

/* Returnează [lat, lng] corect sau null. Detectează și inversarea. */
function getCoords(s) {
  let lat = parseCoord(s.lat, 'lat');
  let lng = parseCoord(s.lng, 'lng');

  // Dacă lat lipsește sau e invalid, dar lng e valid ca lat → inversate
  if (lat === null && lng !== null) {
    const tmpLat = parseCoord(s.lng, 'lat');
    const tmpLng = parseCoord(s.lat, 'lng');
    if (tmpLat !== null && tmpLng !== null) { lat = tmpLat; lng = tmpLng; }
  }

  // Dacă lat e în interval de longitudine și lng în interval de latitudine → inversate
  if (lat !== null && lng !== null) {
    if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) {
      [lat, lng] = [lng, lat];
    }
  }

  if (lat === null || lng === null) return null;
  return [lat, lng];
}

/* ============================================================ */

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([45.9432, 24.9668], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

const apiGet = p => fetch(API_URL + "?" + new URLSearchParams(p), {redirect:'follow'}).then(r=>r.json());
const apiPost = p => fetch(API_URL, {
  method: 'POST',
  body: new URLSearchParams(p).toString(),
  headers: {'Content-Type':'application/x-www-form-urlencoded'}
}).then(r=>r.json());

const showLoad = s => document.getElementById('loading').classList.toggle('show', s);
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

async function load() {
  showLoad(true);
  try {
    const res = await apiGet({ action: 'getAll' });
    if (res.success) {
      stores = res.data;
      render();
    } else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filter = document.getElementById('filter').value;

  const filtered = stores.filter(s => {
    const text = `${s.name} ${s.address} ${s.region}`.toLowerCase();
    if (q && !text.includes(q)) return false;
    const coords = getCoords(s);
    if (filter === 'has' && !coords) return false;
    if (filter === 'no' && coords) return false;
    return true;
  });

  document.getElementById('count').textContent =
    `${filtered.length} din ${stores.length} magazine`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#94a3b8;">Niciun rezultat</div>';
  } else {
    filtered.forEach(s => {
      const coords = getCoords(s);
      const hasLoc = !!coords;
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.row = s.rowIndex;
      div.innerHTML = `
        <div class="card-title">${s.name || 'Fără nume'}</div>
        <div class="card-line"><span class="icon">📍</span>${s.address || 'Fără adresă'}</div>
        ${s.region ? `<span class="region-chip">🗺️ ${s.region}</span>` : ''}
        <span class="status ${hasLoc ? 'has' : 'no'}">${hasLoc ? '✓ Are locație' : '✗ Fără locație'}</span>
        <div class="card-actions">
          <button class="btn-map" onclick="event.stopPropagation();showOnMap(${s.rowIndex})">🗺️ Hartă</button>
          <button class="btn-nav" onclick="event.stopPropagation();openNav(${s.rowIndex})" ${hasLoc ? '' : 'disabled'}>🧭 Navighează</button>
          <button class="btn-edit" onclick="event.stopPropagation();openEdit(${s.rowIndex})">✏️</button>
        </div>
      `;
      div.onclick = () => showOnMap(s.rowIndex);
      list.appendChild(div);
    });
  }

  markersLayer.clearLayers();
  stores.forEach(s => {
    const coords = getCoords(s);
    if (!coords) return;
    L.marker(coords).addTo(markersLayer).bindPopup(
      `<b>${s.name || ''}</b><br><small>${s.address || ''}</small>`
    );
  });
}

function showOnMap(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  const coords = getCoords(s);

  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.card[data-row="${rowIndex}"]`);
  if (card) card.classList.add('active');

  if (!coords) {
    toast('Fără locație — editați pentru a adăuga');
    return;
  }
  map.setView(coords, 16);
  document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- ADĂUGARE ---------- */
function openAdd() {
  ['a_name','a_addr','a_region','a_map','a_lng','a_lat']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('addModal').classList.add('open');
}
async function saveAdd() {
  const data = {
    number: '',
    name: document.getElementById('a_name').value,
    address: document.getElementById('a_addr').value,
    region: document.getElementById('a_region').value,
    mapAddress: document.getElementById('a_map').value,
    lng: document.getElementById('a_lng').value,
    lat: document.getElementById('a_lat').value
  };
  if (!data.name.trim()) { toast('Numele e obligatoriu'); return; }
  showLoad(true);
  try {
    const res = await apiPost({ action: 'add', data: JSON.stringify(data) });
    if (res.success) { toast('✅ Adăugat'); closeM('addModal'); await load(); }
    else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

/* ---------- EDITARE ---------- */
function openEdit(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  document.getElementById('e_row').value = rowIndex;
  document.getElementById('e_name').value = s.name || '';
  document.getElementById('e_addr').value = s.address || '';
  document.getElementById('e_region').value = s.region || '';
  document.getElementById('e_map').value = s.mapAddress || '';
  document.getElementById('e_lng').value = s.lng || '';
  document.getElementById('e_lat').value = s.lat || '';
  document.getElementById('editModal').classList.add('open');
}
async function saveEdit() {
  const data = {
    rowIndex: parseInt(document.getElementById('e_row').value),
    number: '',
    name: document.getElementById('e_name').value,
    address: document.getElementById('e_addr').value,
    region: document.getElementById('e_region').value,
    mapAddress: document.getElementById('e_map').value,
    lng: document.getElementById('e_lng').value,
    lat: document.getElementById('e_lat').value
  };
  if (!data.name.trim()) { toast('Numele e obligatoriu'); return; }
  showLoad(true);
  try {
    const res = await apiPost({ action: 'update', data: JSON.stringify(data) });
    if (res.success) {
      toast('✅ Salvat');
      closeM('editModal');
      await load();
      const coords = getCoords(data);
      if (coords) map.setView(coords, 16);
    } else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

function closeM(id) { document.getElementById(id).classList.remove('open'); }

/* ---------- GPS ---------- */
function gps(prefix) {
  if (!navigator.geolocation) { toast('GPS indisponibil'); return; }
  toast('Se obține locația...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(7);
      const lng = pos.coords.longitude.toFixed(7);
      document.getElementById(prefix + '_lat').value = lat;
      document.getElementById(prefix + '_lng').value = lng;
      document.getElementById(prefix + '_map').value = `https://www.google.com/maps?q=${lat},${lng}`;
      toast('✅ Locație setată');
    },
    err => toast('Eroare GPS: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

/* ============================================================
   🌍 GEOCODING: adresă → coordonate (Nominatim / OpenStreetMap)
   ============================================================ */
async function geocode(prefix) {
  const addr = document.getElementById(prefix + '_addr').value.trim();
  const region = document.getElementById(prefix + '_region').value.trim();
  if (!addr) { toast('Introduceți adresa mai întâi'); return; }

  const query = [addr, region].filter(Boolean).join(', ');
  const btn = document.getElementById(prefix + '_geocodeBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Se caută...';

  try {
    // Nominatim — gratuit, fără cheie API
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url, {
      headers: { 'Accept': 'application/json' }
    });
    const data = await res.json();

    if (!data.length) {
      toast('❌ Adresa nu a fost găsită. Încercați mai detaliat.');
      return;
    }

    const { lat, lon, display_name } = data[0];
    document.getElementById(prefix + '_lat').value = parseFloat(lat).toFixed(7);
    document.getElementById(prefix + '_lng').value = parseFloat(lon).toFixed(7);
    document.getElementById(prefix + '_map').value =
      `https://www.google.com/maps?q=${lat},${lon}`;
    toast('✅ Locație găsită: ' + display_name.split(',').slice(0, 2).join(','));
  } catch(e) {
    toast('Eroare căutare: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🌍 Găsește locația din adresă';
  }
}

/* ---------- NAVIGARE ---------- */
function openNav(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  const coords = getCoords(s);
  if (!coords) { toast('Fără locație'); return; }
  const [lat, lng] = coords;
  navTarget = { lat, lng };

  document.getElementById('navGoogle').href =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  document.getElementById('navWaze').href =
    `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const appleBtn = document.getElementById('navApple');
  if (isIOS) {
    appleBtn.style.display = 'flex';
    appleBtn.href = `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
  } else {
    appleBtn.style.display = 'none';
  }

  document.getElementById('navModal').classList.add('open');
}

function copyCoords() {
  if (!navTarget) return;
  const txt = `${navTarget.lat}, ${navTarget.lng}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      toast('✅ Copiat');
      closeM('navModal');
    }).catch(() => prompt('Copiați:', txt));
  } else {
    prompt('Copiați:', txt);
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);

initMap();
load();
</script>
</body>
