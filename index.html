<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e3a8a">
<title>Magazine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, Roboto, Tahoma, sans-serif;
    background: #f1f5f9; color: #0f172a;
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: linear-gradient(135deg,#1e3a8a,#2563eb);
    color: white; padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    padding-top: max(12px, env(safe-area-inset-top));
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; flex: 1; }
  .add-btn {
    background: rgba(255,255,255,.2); border: none; color: white;
    width: 40px; height: 40px; border-radius: 10px;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .add-btn:active { background: rgba(255,255,255,.4); }

  .search-box {
    background: white; padding: 10px 14px;
    display: flex; gap: 8px; flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
  }
  .search-box input {
    flex: 1; padding: 11px 14px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 15px; font-family: inherit;
    background: #f8fafc;
  }
  .search-box input:focus { outline: none; border-color: #2563eb; background: white; }
  .search-box select {
    padding: 11px 8px; border: 1.5px solid #e2e8f0;
    border-radius: 10px; font-size: 13px; font-family: inherit;
    background: #f8fafc; max-width: 120px;
  }

  #map { height: 220px; width: 100%; flex-shrink: 0; border-bottom: 2px solid #e2e8f0; }
  #countBar {
    padding: 8px 14px; background: #f8fafc; font-size: 12px;
    color: #475569; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
  }
  #list { flex: 1; overflow-y: auto; background: white; -webkit-overflow-scrolling: touch; }

  .card { padding: 14px; border-bottom: 1px solid #e2e8f0; cursor: pointer; }
  .card:active { background: #f1f5f9; }
  .card.active { background: #dbeafe; border-left: 4px solid #2563eb; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .card-line { font-size: 13px; color: #475569; margin-top: 4px; display: flex; gap: 6px; }
  .city-chip {
    display: inline-block; font-size: 11px; padding: 3px 9px;
    background: #ede9fe; color: #6d28d9; border-radius: 10px;
    margin-top: 6px; font-weight: 600;
  }
  .status {
    display: inline-block; font-size: 11px; padding: 3px 9px;
    border-radius: 10px; margin-top: 6px; font-weight: 600;
  }
  .status.has { background: #dcfce7; color: #166534; }
  .status.no { background: #fee2e2; color: #991b1b; }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; }
  .card-actions button {
    flex: 1; padding: 10px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  .btn-map { background: #dbeafe; color: #1e40af; }
  .btn-nav { background: #16a34a; color: white; }
  .btn-edit { background: #f1f5f9; color: #475569; }
  .card-actions button:active { opacity: .7; }
  .card-actions button:disabled { opacity: .4; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(15,23,42,.6);
    display: none; z-index: 1000; align-items: flex-end;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white; width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px 18px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    max-height: 92dvh; overflow-y: auto; animation: slideUp .25s;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 16px; }
  .modal h2 { font-size: 17px; margin-bottom: 16px; text-align: center; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #475569; margin-bottom: 5px; font-weight: 600; }
  .field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    font-family: inherit; font-size: 15px; background: #f8fafc;
  }
  .field input:focus { outline: none; border-color: #2563eb; background: white; }
  .hint { font-size: 11px; color: #64748b; margin-top: 5px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    flex: 1; padding: 13px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .btn-cancel { background: #e2e8f0; color: #475569; }
  .btn-save { background: #16a34a; color: white; }
  .btn-save:disabled { opacity: .5; }

  /* Status card în modal */
  .preview-box {
    background: #f0fdf4; border: 1.5px solid #86efac;
    border-radius: 10px; padding: 12px; margin-bottom: 12px;
    font-size: 13px; color: #166534;
  }
  .preview-box.error {
    background: #fef2f2; border-color: #fca5a5; color: #991b1b;
  }
  .preview-box.loading {
    background: #eff6ff; border-color: #93c5fd; color: #1e40af;
  }
  .preview-box b { font-weight: 700; }

  .nav-option {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px; background: #f8fafc;
    border: 1.5px solid #e2e8f0; border-radius: 12px;
    margin-bottom: 10px; text-decoration: none;
    color: #0f172a; font-size: 15px;
  }
  .nav-option:active { background: #dbeafe; border-color: #2563eb; }
  .nav-option .nicon {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .nav-option .ntext { flex: 1; font-weight: 600; }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: white; padding: 12px 22px;
    border-radius: 12px; font-size: 14px; opacity: 0;
    transition: opacity .3s; pointer-events: none;
    z-index: 2000; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  #loading {
    position: fixed; inset: 0; background: rgba(255,255,255,.85);
    display: none; align-items: center; justify-content: center;
    z-index: 3000; flex-direction: column; gap: 14px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #e2e8f0;
    border-top-color: #2563eb; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>🏪 Magazine</h1>
  <button class="add-btn" onclick="openAdd()">+</button>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="🔍 Nume magazin...">
  <select id="cityFilter">
    <option value="">Toate orașele</option>
  </select>
</div>

<div id="map"></div>
<div id="countBar"><span id="count">Se încarcă...</span></div>
<div id="list"></div>

<!-- MODAL ADAUGĂ -->
<div class="modal-bg" id="addModal" onclick="if(event.target===this)closeM('addModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>➕ Magazin nou</h2>

    <div class="field">
      <label>Nume magazin *</label>
      <input id="a_name" placeholder="ex: Mega Image Lipscani">
    </div>

    <div class="field">
      <label>Locație (link Google Maps / Waze / Apple Maps)</label>
      <input id="a_link" placeholder="Lipiți link sau folosiți butonul de jos">
      <div class="hint">Acceptă: google.com/maps, goo.gl/maps, waze.com, maps.apple.com</div>
    </div>

    <div id="a_preview" style="display:none;"></div>

    <button class="btn-gps" onclick="gps('a')" style="background:#d97706;color:white;padding:13px;border:none;border-radius:10px;width:100%;font-size:14px;font-weight:700;margin-bottom:12px;font-family:inherit;cursor:pointer;">
      📍 Folosește locația mea acum
    </button>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeM('addModal')">Anulează</button>
      <button class="btn-save" id="a_saveBtn" onclick="saveAdd()">💾 Salvează</button>
    </div>
  </div>
</div>

<!-- MODAL EDITEAZĂ -->
<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeM('editModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>✏️ Editează magazin</h2>
    <input type="hidden" id="e_row">

    <div class="field">
      <label>Nume magazin *</label>
      <input id="e_name">
    </div>

    <div class="field">
      <label>Locație (link nou)</label>
      <input id="e_link" placeholder="Lăsați gol pentru a păstra locația existentă">
    </div>

    <div id="e_preview" style="display:none;"></div>

    <button class="btn-gps" onclick="gps('e')" style="background:#d97706;color:white;padding:13px;border:none;border-radius:10px;width:100%;font-size:14px;font-weight:700;margin-bottom:12px;font-family:inherit;cursor:pointer;">
      📍 Folosește locația mea acum
    </button>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeM('editModal')">Anulează</button>
      <button class="btn-save" onclick="saveEdit()">💾 Salvează</button>
    </div>
  </div>
</div>

<!-- MODAL NAVIGARE -->
<div class="modal-bg" id="navModal" onclick="if(event.target===this)closeM('navModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>🧭 Deschide în</h2>
    <a class="nav-option" id="navGoogle" target="_blank" rel="noopener">
      <div class="nicon" style="background:#dbeafe;">🗺️</div>
      <div class="ntext">Google Maps</div>
    </a>
    <a class="nav-option" id="navWaze" target="_blank" rel="noopener">
      <div class="nicon" style="background:#dcfce7;">🚗</div>
      <div class="ntext">Waze</div>
    </a>
    <a class="nav-option" id="navApple" target="_blank" rel="noopener" style="display:none;">
      <div class="nicon" style="background:#f1f5f9;">🍎</div>
      <div class="ntext">Apple Maps</div>
    </a>
    <button class="btn-cancel" style="width:100%;padding:13px;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;" onclick="closeM('navModal')">Închide</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spinner"></div></div>

<script>
/* ⚠️ PUNEȚI AICI LINKUL APPS SCRIPT */
const API_URL = "https://script.google.com/macros/s/AKfycbyPOsBcnW2d8kHf1-vzT5ynRenybxocEc08wTw1MIvBJt2K9jWPXhKa0foPzUYLLe1oKQ/exec";

let stores = [];
let map, markersLayer;
let navTarget = null;
let pendingLocation = { add: null, edit: null }; // {lat, lng, city, mapLink}

/* ============================================================
   🔧 PARSARE COORDONATE (rezolvă problema cu virgula)
   ============================================================ */
function parseCoord(val, type) {
  if (val === null || val === undefined) return null;
  let s = String(val).trim().replace(',', '.').replace(/\s+/g, '');
  const num = parseFloat(s);
  if (isNaN(num)) return null;
  if (type === 'lat' && (num < -90 || num > 90)) return null;
  if (type === 'lng' && (num < -180 || num > 180)) return null;
  return num;
}
function getCoords(s) {
  let lat = parseCoord(s.lat, 'lat');
  let lng = parseCoord(s.lng, 'lng');
  if (lat !== null && lng !== null && Math.abs(lat) > 90 && Math.abs(lng) <= 90) {
    [lat, lng] = [lng, lat];
  }
  if (lat === null || lng === null) return null;
  return [lat, lng];
}

/* ============================================================
   🔗 EXTRAGERE COORDONATE DIN ORICE LINK
   Acceptă: Google Maps, goo.gl/maps, Waze, Apple Maps
   ============================================================ */
async function extractCoordsFromLink(url) {
  if (!url) return null;
  url = url.trim();

  // 1. Coordonate directe în URL (pattern simplu)
  // Ex: @44.4268,26.1025 sau ?q=44.4268,26.1025 sau /44.4268,26.1025
  const patterns = [
    /@(-?\d+\.?\d*),(-?\d+\.?\d*)/,           // google maps @lat,lng
    /[?&]q=(-?\d+\.?\d*),(-?\d+\.?\d*)/,      // ?q=lat,lng
    /[?&]ll=(-?\d+\.?\d*),(-?\d+\.?\d*)/,     // waze ll=
    /[?&]center=(-?\d+\.?\d*),(-?\d+\.?\d*)/, // center=
    /!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/,       // google maps data !3d!4d
    /\/place\/(-?\d+\.?\d*),(-?\d+\.?\d*)/,   // /place/lat,lng
    /^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/     // direct lat,lng
  ];

  for (const p of patterns) {
    const m = url.match(p);
    if (m) {
      const lat = parseFloat(m[1]);
      const lng = parseFloat(m[2]);
      if (!isNaN(lat) && !isNaN(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        return { lat, lng };
      }
    }
  }

  // 2. Linkuri scurte (goo.gl, maps.app.goo.gl, waze.com/ul, apple.co)
  // — trebuie urmărite (redirect)
  const isShort = /goo\.gl|maps\.app\.goo\.gl|waze\.com\/ul|apple\.co|maps\.apple\.com/i.test(url);
  if (isShort) {
    try {
      // Folosim un serviciu de expandare CORS-friendly
      const expandUrl = `https://unshorten.me/api/v2/unshorten?url=${encodeURIComponent(url)}`;
      // Alternativ: încercăm direct fetch cu no-cors (nu funcționează întotdeauna)
      // Folosim r.jina.ai ca proxy pentru redirect
      const proxyUrl = `https://r.jina.ai/${url}`;
      const res = await fetch(proxyUrl, { method: 'GET' });
      // Nu putem citi mereu body-ul, dar URL-ul original poate fi în header
      // Încercăm din nou pattern-urile pe URL-ul redirectat
      const text = await res.text().catch(() => '');

      // Extragem din text orice coordonate
      for (const p of patterns) {
        const m = text.match(p);
        if (m) {
          const lat = parseFloat(m[1]);
          const lng = parseFloat(m[2]);
          if (!isNaN(lat) && !isNaN(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
            return { lat, lng };
          }
        }
      }
    } catch(e) {
      console.warn('Eroare expandare link scurt:', e);
    }
  }

  return null;
}

/* ============================================================
   🏙️ REVERSE GEOCODING: coordonate → oraș (Nominatim)
   ============================================================ */
async function reverseGeocode(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if (!data.address) return '';
    const a = data.address;
    return a.city || a.town || a.village || a.municipality || a.county || a.state || '';
  } catch(e) {
    return '';
  }
}

/* ============================================================
   🔄 PROCESARE COMPLETĂ: link → coords + oraș
   ============================================================ */
async function processLocation(input, prefix, previewEl) {
  previewEl.style.display = 'block';
  previewEl.className = 'preview-box loading';
  previewEl.innerHTML = '⏳ Se procesează locația...';

  let coords = null;

  // Verificăm dacă e coordonată directă
  const directMatch = input.trim().match(/^(-?\d+\.?\d*)\s*[,;]\s*(-?\d+\.?\d*)$/);
  if (directMatch) {
    coords = { lat: parseFloat(directMatch[1]), lng: parseFloat(directMatch[2]) };
  } else {
    coords = await extractCoordsFromLink(input);
  }

  if (!coords) {
    previewEl.className = 'preview-box error';
    previewEl.innerHTML = '❌ Nu am putut extrage coordonatele. Verificați linkul.';
    pendingLocation[prefix] = null;
    return;
  }

  // Validare
  if (Math.abs(coords.lat) > 90 || Math.abs(coords.lng) > 180) {
    previewEl.className = 'preview-box error';
    previewEl.innerHTML = '❌ Coordonate invalide.';
    pendingLocation[prefix] = null;
    return;
  }

  // Reverse geocode pentru oraș
  previewEl.innerHTML = '⏳ Se identifică orașul...';
  const city = await reverseGeocode(coords.lat, coords.lng);

  pendingLocation[prefix] = {
    lat: coords.lat.toFixed(7),
    lng: coords.lng.toFixed(7),
    city: city,
    mapLink: `https://www.google.com/maps?q=${coords.lat},${coords.lng}`
  };

  previewEl.className = 'preview-box';
  previewEl.innerHTML = `
    <b>✅ Locație detectată</b><br>
    🏙️ <b>${city || 'Oraș necunoscut'}</b><br>
    <small style="direction:ltr;display:inline-block;">📍 ${coords.lat.toFixed(6)}, ${coords.lng.toFixed(6)}</small>
  `;
}

/* ============================================================ */

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([45.9432, 24.9668], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

const apiGet = p => fetch(API_URL + "?" + new URLSearchParams(p), {redirect:'follow'}).then(r=>r.json());
const apiPost = p => fetch(API_URL, {
  method: 'POST',
  body: new URLSearchParams(p).toString(),
  headers: {'Content-Type':'application/x-www-form-urlencoded'}
}).then(r=>r.json());

const showLoad = s => document.getElementById('loading').classList.toggle('show', s);
function toast(msg, dur = 2400) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), dur);
}

async function load() {
  showLoad(true);
  try {
    const res = await apiGet({ action: 'getAll' });
    if (res.success) {
      stores = res.data;
      populateCities();
      render();
    } else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

function populateCities() {
  const cities = [...new Set(stores.map(s => (s.region || '').trim()).filter(Boolean))].sort();
  const sel = document.getElementById('cityFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">Toate orașele</option>' +
    cities.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = current;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const city = document.getElementById('cityFilter').value;

  const filtered = stores.filter(s => {
    if (q && !(s.name || '').toLowerCase().includes(q)) return false;
    if (city && (s.region || '').trim() !== city) return false;
    return true;
  });

  document.getElementById('count').textContent =
    `${filtered.length} din ${stores.length} magazine`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#94a3b8;">Niciun rezultat</div>';
  } else {
    filtered.forEach(s => {
      const coords = getCoords(s);
      const hasLoc = !!coords;
      const div = document.createElement('div');
      div.className = 'card';
      div.dataset.row = s.rowIndex;
      div.innerHTML = `
        <div class="card-title">${s.name || 'Fără nume'}</div>
        ${s.region ? `<span class="city-chip">🏙️ ${s.region}</span>` : ''}
        <span class="status ${hasLoc ? 'has' : 'no'}">${hasLoc ? '✓ Are locație' : '✗ Fără locație'}</span>
        <div class="card-actions">
          <button class="btn-map" onclick="event.stopPropagation();showOnMap(${s.rowIndex})" ${hasLoc ? '' : 'disabled'}>🗺️ Hartă</button>
          <button class="btn-nav" onclick="event.stopPropagation();openNav(${s.rowIndex})" ${hasLoc ? '' : 'disabled'}>🧭 Navighează</button>
          <button class="btn-edit" onclick="event.stopPropagation();openEdit(${s.rowIndex})">✏️</button>
        </div>
      `;
      div.onclick = () => showOnMap(s.rowIndex);
      list.appendChild(div);
    });
  }

  markersLayer.clearLayers();
  stores.forEach(s => {
    const coords = getCoords(s);
    if (!coords) return;
    L.marker(coords).addTo(markersLayer).bindPopup(
      `<b>${s.name || ''}</b>${s.region ? `<br><small>${s.region}</small>` : ''}`
    );
  });
}

function showOnMap(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  const coords = getCoords(s);
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const card = document.querySelector(`.card[data-row="${rowIndex}"]`);
  if (card) card.classList.add('active');
  if (!coords) { toast('Fără locație'); return; }
  map.setView(coords, 16);
  document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- ADĂUGARE ---------- */
function openAdd() {
  document.getElementById('a_name').value = '';
  document.getElementById('a_link').value = '';
  document.getElementById('a_preview').style.display = 'none';
  pendingLocation.add = null;
  document.getElementById('addModal').classList.add('open');
}

document.getElementById('a_link').addEventListener('change', async e => {
  const url = e.target.value.trim();
  if (!url) return;
  await processLocation(url, 'add', document.getElementById('a_preview'));
});

async function saveAdd() {
  const name = document.getElementById('a_name').value.trim();
  if (!name) { toast('Numele e obligatoriu'); return; }

  const loc = pendingLocation.add;
  if (!loc) { toast('Adăugați un link sau folosiți GPS'); return; }

  const data = {
    number: '',
    name: name,
    address: '',
    mapAddress: loc.mapLink,
    lng: loc.lng,
    lat: loc.lat,
    region: loc.city
  };
  showLoad(true);
  try {
    const res = await apiPost({ action: 'add', data: JSON.stringify(data) });
    if (res.success) { toast('✅ Adăugat'); closeM('addModal'); await load(); }
    else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

/* ---------- EDITARE ---------- */
function openEdit(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  document.getElementById('e_row').value = rowIndex;
  document.getElementById('e_name').value = s.name || '';
  document.getElementById('e_link').value = '';
  document.getElementById('e_preview').style.display = 'none';
  pendingLocation.edit = null;

  const coords = getCoords(s);
  if (coords) {
    pendingLocation.edit = {
      lat: coords[0].toFixed(7),
      lng: coords[1].toFixed(7),
      city: s.region || '',
      mapLink: s.mapAddress || `https://www.google.com/maps?q=${coords[0]},${coords[1]}`
    };
    const pv = document.getElementById('e_preview');
    pv.style.display = 'block';
    pv.className = 'preview-box';
    pv.innerHTML = `
      <b>Locație existentă</b><br>
      🏙️ <b>${s.region || 'Necunoscut'}</b><br>
      <small style="direction:ltr;display:inline-block;">📍 ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}</small>
    `;
  }

  document.getElementById('editModal').classList.add('open');
}

document.getElementById('e_link').addEventListener('change', async e => {
  const url = e.target.value.trim();
  if (!url) return;
  await processLocation(url, 'edit', document.getElementById('e_preview'));
});

async function saveEdit() {
  const name = document.getElementById('e_name').value.trim();
  if (!name) { toast('Numele e obligatoriu'); return; }
  const loc = pendingLocation.edit;
  if (!loc) { toast('Nu există locație'); return; }

  const data = {
    rowIndex: parseInt(document.getElementById('e_row').value),
    number: '',
    name: name,
    address: '',
    mapAddress: loc.mapLink,
    lng: loc.lng,
    lat: loc.lat,
    region: loc.city
  };
  showLoad(true);
  try {
    const res = await apiPost({ action: 'update', data: JSON.stringify(data) });
    if (res.success) {
      toast('✅ Salvat');
      closeM('editModal');
      await load();
      const coords = getCoords(data);
      if (coords) map.setView(coords, 16);
    } else toast('Eroare: ' + res.message);
  } catch(e) { toast('Eroare conexiune'); }
  finally { showLoad(false); }
}

function closeM(id) { document.getElementById(id).classList.remove('open'); }

/* ---------- GPS ---------- */
function gps(prefix) {
  if (!navigator.geolocation) { toast('GPS indisponibil'); return; }
  toast('Se obține locația...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const previewEl = document.getElementById(prefix + '_preview');
      previewEl.style.display = 'block';
      previewEl.className = 'preview-box loading';
      previewEl.innerHTML = '⏳ Se identifică orașul...';

      const city = await reverseGeocode(lat, lng);
      pendingLocation[prefix] = {
        lat: lat.toFixed(7),
        lng: lng.toFixed(7),
        city: city,
        mapLink: `https://www.google.com/maps?q=${lat},${lng}`
      };

      previewEl.className = 'preview-box';
      previewEl.innerHTML = `
        <b>✅ Locație GPS detectată</b><br>
        🏙️ <b>${city || 'Oraș necunoscut'}</b><br>
        <small style="direction:ltr;display:inline-block;">📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}</small>
      `;
      toast('✅ Locație setată');
    },
    err => toast('Eroare GPS: ' + err.message),
    { enableHighAccuracy: true, timeout: 20000 }
  );
}

/* ---------- NAVIGARE ---------- */
function openNav(rowIndex) {
  const s = stores.find(x => x.rowIndex === rowIndex);
  if (!s) return;
  const coords = getCoords(s);
  if (!coords) { toast('Fără locație'); return; }
  const [lat, lng] = coords;
  navTarget = { lat, lng };

  document.getElementById('navGoogle').href =
    `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  document.getElementById('navWaze').href =
    `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const appleBtn = document.getElementById('navApple');
  if (isIOS) {
    appleBtn.style.display = 'flex';
    appleBtn.href = `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
  } else {
    appleBtn.style.display = 'none';
  }
  document.getElementById('navModal').classList.add('open');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('cityFilter').addEventListener('change', render);

initMap();
load();
</script>
